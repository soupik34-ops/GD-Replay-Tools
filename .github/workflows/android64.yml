name: Build Android ARM64 Geode mod

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build for Android ARM64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-Replay-Tools-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
